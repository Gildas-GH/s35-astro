media: 
  input: public
  output: /
content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename:
      template: "{primary}.md"
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          maxlength: 70
      - name: description
        label: Description
        type: text
        options:
          maxlength: 140
      - name: body
        label: Contenu
        type: rich-text
      - name: formation
        label: Page formation
        description: Si actif, la liste des formations du CEFI Solidaires Bretagne sera ajoutée sur la page sous le contenu.
        type: boolean
        default: false
      - name: documents
        label: Documents associés
        type: file
        description: Ces documents seront proposés en téléchargement en bas de page.
        options:
          # categories: [document]
          multiple:
            max: 5
          unique: true
      - name: image
        label: Image principale
        type: image
      - name: map
        label: Carte
        description: Permet d'afficher et de personnaliser une carte sur la page. Laisser vide pour ne pas afficher de carte.
        type: object
        fields:
          - name: latitude
            label: Latitude
            type: number
          - name: longitude
            label: Longitude
            type: number
          - name: address
            label: Adresse affichée
            type: string
          - name: transit
            label: Accès en métro
            type: string
      - name: embed
        label: Intégrer une page
        description: Permet d'intégrer une autre page dans la page, par exemple un Framaforms, une vidéo YouTube...
        type: text
      - name: permanences
        label: Dates de permanence
        description: Entrez des dates et le site affichera la prochaine échéance (par exemple "premier lundi du mois")
        type: string
        list: true
